name: Build FakeCam Dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cache Theos & SDK
        uses: actions/cache@v4
        with:
          path: $HOME/theos
          key: theos-final-v2

      - name: Prepare Theos environment
        run: |
          export THEOS=$HOME/theos
          # 克隆theos本体，不存在才clone
          if [ ! -d "$THEOS/bin" ]; then
            git clone --depth=1 https://github.com/theos/theos.git $THEOS
          fi
          # 只有iPhoneOS15.0.sdk不存在，才克隆sdks仓库
          if [ ! -d "$THEOS/sdks/iPhoneOS15.0.sdk" ]; then
            git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks
          fi
          brew install ldid make

      - name: Compile Tweak
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: FakeCamDylib
          path: .theos/obj/arm64/FakeCam.dylib

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: FakeCam_DEB
          path: packages/*.deb
