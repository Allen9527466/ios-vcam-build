name: Build FakeCam Dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & Compile
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos $THEOS
          brew install ldid
          
          # 创建sdks目录，下载iPhoneOS15.0 SDK（这个链接稳定可用）
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -L https://github.com/theos/sdks/raw/master/iPhoneOS15.0.sdk.tar.xz -o iPhoneOS15.0.sdk.tar.xz
          tar -xf iPhoneOS15.0.sdk.tar.xz
          
          # 返回源码目录编译
          cd $GITHUB_WORKSPACE
          make package

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeCamDylib
          path: .theos/obj/arm64/FakeCam.dylib
