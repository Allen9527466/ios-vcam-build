name: Build FakeCam Dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: ""

      - name: Cache SDKs
        uses: actions/cache@v4
        with:
          path: $HOME/theos/sdks
          key: theos-sdks-full

      - name: Clone sdks if missing
        run: |
          export THEOS=$HOME/theos
          if [ ! -d "$THEOS/sdks/iPhoneOS15.0.sdk" ]; then
            git clone https://github.com/theos/sdks.git $THEOS/sdks
          fi

      - name: Build Tweak
        run: make package

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: FakeCamDylib
          path: .theos/obj/arm64/FakeCam.dylib
