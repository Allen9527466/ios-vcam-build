name: Build FakeCam Dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cache Theos + SDKs
        uses: actions/cache@v4
        with:
          path: |
            $HOME/theos
          key: theos-full-v1

      - name: Install Theos and SDK
        run: |
          export THEOS=$HOME/theos
          if [ ! -d "$THEOS/bin" ]; then
            curl --retry 5 --retry-delay 3 -s https://raw.githubusercontent.com/theos/theos/master/bin/install-theos | bash -s -- --yes
          fi
          if [ ! -d "$THEOS/sdks/iPhoneOS15.0.sdk" ]; then
            git clone https://github.com/theos/sdks.git $THEOS/sdks
          fi

      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FakeCamDylib
          path: .theos/obj/arm64/FakeCam.dylib

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: FakeCam_DEB
          path: packages/*.deb
