name: Build FakeCam Dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & Compile
        run: |
          # 一次性全部在同一个shell执行，环境变量不会丢失
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos $THEOS
          brew install ldid
          
          # 下载SDK
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -L https://github.com/theos/sdks/raw/master/iPhoneOS14.0.sdk.tar.xz -o sdk.tar.xz
          tar -xf sdk.tar.xz
          
          # 回到源码目录编译
          cd $GITHUB_WORKSPACE
          make package

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeCamDylib
          path: .theos/obj/arm64/FakeCam.dylib
