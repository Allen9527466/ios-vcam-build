name: Build Pure ObjC VirtualCam dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get iPhone SDK
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV

      - name: Compile arm64
        run: |
          xcrun clang -arch arm64 -isysroot ${{ env.SDK_PATH }} -mios-version-min=15.0 -fobjc-arc -c main.m -o main_arm64.o
          xcrun clang -arch arm64 -isysroot ${{ env.SDK_PATH }} -mios-version-min=15.0 -fobjc-arc -dynamiclib main_arm64.o -o libVirtualCam_arm64.dylib -framework UIKit -framework AVFoundation -framework CoreMedia -framework Foundation -lsubstrate

      - name: Compile arm64e
        run: |
          xcrun clang -arch arm64e -isysroot ${{ env.SDK_PATH }} -mios-version-min=15.0 -fobjc-arc -c main.m -o main_arm64e.o
          xcrun clang -arch arm64e -isysroot ${{ env.SDK_PATH }} -mios-version-min=15.0 -fobjc-arc -dynamiclib main_arm64e.o -o libVirtualCam_arm64e.dylib -framework UIKit -framework AVFoundation -framework CoreMedia -framework Foundation -lsubstrate

      - name: Lipo merge FAT
        run: |
          xcrun lipo -create libVirtualCam_arm64.dylib libVirtualCam_arm64e.dylib -output libVirtualCam.dylib
          xcrun lipo -info libVirtualCam.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: virtualcam-dylib
          path: libVirtualCam.dylib
