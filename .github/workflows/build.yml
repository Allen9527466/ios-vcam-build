name: Build iOS dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: compile obj‑c
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -c ProxyDelegate.m -o ProxyDelegate.o \
            -target arm64-apple-ios14.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -framework AVFoundation -framework Foundation -framework CoreMedia

      - name: compile swift + link obj‑c object
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -emit-library -o VirtualCamDylib.dylib VirtualCamDylib.swift ProxyDelegate.o \
            -target arm64-apple-ios14.0 \
            -sdk "$SDK" \
            -lobjc \
            -framework UIKit \
            -framework AVFoundation \
            -framework CoreMedia \
            -framework CoreVideo

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCamDylib
          path: VirtualCamDylib.dylib
