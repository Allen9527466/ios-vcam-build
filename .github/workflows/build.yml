name: Build iOS dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get iPhoneOS SDK path
        id: getsdk
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV
          echo "SDK Path: $SDK_PATH"

      - name: Compile ObjC arm64
        run: |
          xcrun clang -arch arm64 -isysroot ${{ env.SDK_PATH }} -mios-version-min=15.0 -fobjc-arc -c ProxyDelegate.m -o ProxyDelegate_arm64.o

      - name: Build arm64 dylib (swiftc link, include objc .o)
        run: |
          xcrun swiftc \
            -target arm64-apple-ios15.0 \
            -sdk ${{ env.SDK_PATH }} \
            -emit-library \
            -o libVirtualCam_arm64.dylib \
            VirtualCamDylib.swift ProxyDelegate_arm64.o \
            -framework UIKit -framework AVFoundation -framework CoreMedia -framework Foundation

      - name: Compile ObjC arm64e
        run: |
          xcrun clang -arch arm64e -isysroot ${{ env.SDK_PATH }} -mios-version-min=15.0 -fobjc-arc -c ProxyDelegate.m -o ProxyDelegate_arm64e.o

      - name: Build arm64e dylib (swiftc link, include objc .o)
        run: |
          xcrun swiftc \
            -target arm64e-apple-ios15.0 \
            -sdk ${{ env.SDK_PATH }} \
            -emit-library \
            -o libVirtualCam_arm64e.dylib \
            VirtualCamDylib.swift ProxyDelegate_arm64e.o \
            -framework UIKit -framework AVFoundation -framework CoreMedia -framework Foundation

      - name: Lipo merge FAT dylib
        run: |
          xcrun lipo -create libVirtualCam_arm64.dylib libVirtualCam_arm64e.dylib -output libVirtualCam.dylib
          xcrun lipo -info libVirtualCam.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-dylib
          path: libVirtualCam.dylib
