name: Build FakeCam Dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & Compile
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos $THEOS
          brew install ldid
          
          # 回到源码目录，theos会自动拉取需要的SDK
          cd $GITHUB_WORKSPACE
          make package

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeCamDylib
          path: .theos/obj/arm64/FakeCam.dylib
