name: Build FakeCam Dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos ~/theos
          echo "export THEOS=$HOME/theos" >> ~/.zshrc
          source ~/.zshrc
          brew install ldid

      - name: Download iPhoneOS14.0 SDK
        run: |
          cd $THEOS/sdks
          curl -L https://github.com/theos/sdks/raw/master/iPhoneOS14.0.sdk.tar.xz -o sdk.tar.xz
          tar -xf sdk.tar.xz

      - name: Compile Tweak
        run: |
          source ~/.zshrc
          make package

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeCamDylib
          path: .theos/obj/arm64/FakeCam.dylib
