name: build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile & Link
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV
          xcrun clang -arch arm64 \
          -isysroot $SDK_PATH \
          -mios-version-min=15.0 \
          -fobjc-arc \
          -c main.m -o main_arm64.o
          
          xcrun clang -arch arm64 \
          -isysroot $SDK_PATH \
          -mios-version-min=15.0 \
          -fobjc-arc \
          -dynamiclib main_arm64.o \
          -o libVirtualCam.dylib \
          -framework UIKit \
          -framework AVFoundation \
          -framework CoreMedia \
          -framework CoreVideo \
          -framework Foundation \
          -framework Metal \
          -framework QuartzCore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libVirtualCam
          path: libVirtualCam.dylib
