name: Build FakeCam Dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare Theos environment (NO CACHE)
        run: |
          export THEOS=$HOME/theos
          rm -rf $THEOS
          git clone --depth=1 --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks
          brew install ldid make

      - name: Compile Tweak (ONLY DYLIB, NO DEB)
        run: |
          export THEOS=$HOME/theos
          make

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: FakeCamDylib
          path: .theos/obj/arm64/FakeCam.dylib
