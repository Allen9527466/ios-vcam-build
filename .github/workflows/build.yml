name: Build FakeCam Tweak
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup Theos
      uses: theos/setup-theos@v1
      with:
        theos-version: latest

    - name: Build Tweak
      shell: bash
      run: |
        export THEOS=$HOME/theos
        set -x
        # 不截断clang输出，打印全部编译信息
        make clean
        make TARGET=iphone:clang:latest:14.0 2>&1 | tee build_log.txt

    - name: Show full compile log
      run: cat build_log.txt

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: FakeCam-Dylib
        path: .theos/obj/debug/arm64/FakeCam.dylib
