name: Build FakeCam Dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 一键部署Theos + 自动拉取 iPhoneOS15.0 SDK，支持缓存
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-list: iPhoneOS15.0.sdk

      - name: Build Tweak
        run: make package

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: FakeCamDylib
          path: .theos/obj/arm64/FakeCam.dylib
